<!DOCTYPE html>
<html lang="es">
<head>
  <!-- SDK oficial de TON Connect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crypto Miner Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .balance-container {
      text-align: center;
      margin-bottom: 30px;
    }
    .balance {
      font-size: 3rem;
      font-weight: bold;
      color: #00ffcc;
    }
    .coin {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe600, #ff9900);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      box-shadow: 0 0 30px rgba(255, 153, 0, 0.6);
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .coin:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="balance-container">
    <h2>Saldo de Cripto</h2>
    <div class="balance" id="score">0</div>
  </div>

  <div class="coin" id="tapButton">🪙</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expande la app a pantalla completa en Telegram

    let points = parseInt(localStorage.getItem('user_points')) || 0;
    const scoreEl = document.getElementById('score');
    const coinEl = document.getElementById('tapButton');

    scoreEl.innerText = points;

    coinEl.addEventListener('click', () => {
      points += 1;
      scoreEl.innerText = points;
      localStorage.setItem('user_points', points);
      
      // Vibración hápter móvil si está soportado por Telegram
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    });
  </script>
</body>
</html>
