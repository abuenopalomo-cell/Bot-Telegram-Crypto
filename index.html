<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Android Miner</title>
    <!-- SDK de Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- SDK oficial de TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        h2 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin: 0;
        }
        #score {
            font-size: 3.5rem;
            font-weight: bold;
            color: #facc15;
            margin: 0;
        }
        .coin-btn {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
            padding: 0;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
        .coin-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
        }
        #ton-connect {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Saldo BTCA</h2>
        <div id="score">0</div>

        <!-- Botón de la Moneda para hacer Clic -->
        <button class="coin-btn" id="clickButton">
            <img src="https://raw.githubusercontent.com/abuenopalomo-cell/Bot-Telegram-Crypto/main/logo.png" alt="BTCA Coin" class="coin-img" onerror="this.src='https://images.unsplash.com/photo-1621416894569-0f39ed31d247?w=150'">
        </button>

        <!-- Botón oficial de TON Connect para vincular la wallet -->
        <div id="ton-connect"></div>
    </div>

    <script>
        // Inicializar Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Lógica del contador de clics
        let score = localStorage.getItem('btca_score') ? parseInt(localStorage.getItem('btca_score')) : 0;
        const scoreElement = document.getElementById('score');
        scoreElement.textContent = score;

        document.getElementById('clickButton').addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score;
            localStorage.setItem('btca_score', score);
            
            // Vibración háptica sutil si está disponible en Telegram
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Inicializar TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://abuenopalomo-cell.github.io/Bot-Telegram-Crypto/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });
    </script>
</body>
</html>
