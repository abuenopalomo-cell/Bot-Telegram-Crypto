<!DOCTYPE html>
<html lang="es">
<head>
  <!-- SDK oficial de TON Connect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crypto Miner Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .balance-container {
      text-align: center;
      margin-bottom: 30px;
    }
    .balance {
      font-size: 3rem;
      font-weight: bold;
      color: #00ffcc;
    }
    .coin {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe600, #ff9900);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      box-shadow: 0 0 30px rgba(255, 153, 0, 0.6);
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .coin:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Contenedor donde aparecerá el botón oficial de conectar wallet -->
  <div id="ton-connect" style="margin-top: 20px;"></div>
  <div class="balance-container">
    <h2>Saldo de Cripto</h2>
    <div class="balance" id="score">0</div>
  </div>

  <div class="coin" id="tapButton">🪙</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expande la app a pantalla completa en Telegram

    let points = parseInt(localStorage.getItem('user_points')) || 0;
    const scoreEl = document.getElementById('score');
    const coinEl = document.getElementById('tapButton');

    scoreEl.innerText = points;

    coinEl.addEventListener('click', () => {
      points += 1;
      scoreEl.innerText = points;
      localStorage.setItem('user_points', points);
      
      // Vibración hápter móvil si está soportado por Telegram
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    });
  </script>
  <script>
    // Inicializar TON Connect UI
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://tu-usuario.github.io/tu-repositorio/tonconnect-manifest.json',
        uiPreferences: {
            theme: 'DARK'
        }
    });

    // Función para reclamar tokens cuando el usuario haga clic en un botón de "Claim"
    async function claimTokens(amountToSend) {
        if (!tonConnectUI.connected) {
            alert("Por favor, conecta tu billetera TON primero.");
            tonConnectUI.openModal();
            return;
        }

        // Estructura de la transacción hacia tu contrato o dirección creadora
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 60, // Expira en 60 segundos
            messages: [
                {
                    address: "AQUÍ_PEGAS_LA_DIRECCION_DE_TU_CONTRATO_O_WALLET", 
                    amount: "50000000", // Comision en nanotons (ej. 0.05 TON para gas)
                    // Opcionalmente puedes codificar el payload para interactuar con tu contrato Tact
                }
            ]
        };

        try {
            const result = await tonConnectUI.sendTransaction(transaction);
            alert("¡Transacción enviada con éxito a la blockchain!");
            console.log(result);
        } catch (error) {
            console.error("Error al realizar la transacción:", error);
        }
    }
</script>
</body>
</html>
